<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="text-gray-800 antialiased w-screen h-screen overflow-y-auto overflow-x-hidden flex flex-col relative">

    <header class="p-6 flex justify-between items-baseline relative z-20 w-full">
        <h1 class="text-3xl futura-light tracking-wide text-gray-900">Weave</h1>
        <span class="text-[10px] font-medium tracking-[0.2em] text-gray-500 uppercase">Tokyo, JP</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center relative w-full px-6 pb-6">

        <div class="w-full max-w-sm flex flex-col items-center gap-y-8">

            <!-- Name input -->
            <div class="w-full relative group">
                <label class="absolute -top-3 left-4 bg-[#fafbfc] px-3 py-0.5 flex items-baseline gap-x-1.5 z-10 border border-transparent group-focus-within:border-gray-200 rounded-full transition-colors duration-300">
                    <span class="futura-light text-sm text-gray-800">名前</span>
                    <span class="text-[8px] font-medium tracking-widest text-gray-400 uppercase">Name</span>
                </label>
                <input id="nameInput" type="text" placeholder="お名前を入力"
                    class="w-full bg-white border border-gray-200 rounded-2xl py-4 pl-5 pr-12 text-sm font-light focus:outline-none focus:border-gray-400 focus:ring-4 focus:ring-gray-50 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] transition-all placeholder:text-gray-300">
                <img src="icon button/flight-takeoff-line.png" class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 opacity-20 grayscale pointer-events-none" alt="">
            </div>

            <!-- Divider -->
            <div class="w-full flex items-center gap-x-3">
                <div class="flex-1 h-[1px] bg-gray-100"></div>
                <span class="flex items-baseline gap-x-1.5 whitespace-nowrap">
                    <span class="futura-light text-sm text-gray-700">地域</span>
                    <span class="text-[8px] font-medium tracking-widest text-gray-400 uppercase">Area</span>
                </span>
                <div class="flex-1 h-[1px] bg-gray-100"></div>
            </div>

            <!-- Region grid -->
            <div class="w-full grid grid-cols-2 gap-2.5">

                <button data-region="asia" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Asia</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">アジア</span>
                    </div>
                </button>

                <button data-region="se" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">SE Asia</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">東南アジア</span>
                    </div>
                </button>

                <button data-region="eu" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Europe</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">ヨーロッパ</span>
                    </div>
                </button>

                <button data-region="us" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Americas</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">アメリカ大陸</span>
                    </div>
                </button>

                <button data-region="oc" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Oceania</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">オセアニア</span>
                    </div>
                </button>

                <button data-region="other" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Other</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">ほか</span>
                    </div>
                </button>

            </div>
        </div>
    </main>

    <!-- New Cloud & Glass CTA Footer -->
    <div class="bottom-action-area">
        <div class="blue-cloud-bg"></div>
        <div class="cta-wrapper">
            <button id="recommendBtn" class="process-cta">
                <span class="cta-label">おすすめ PROCESS</span>
                <div class="cta-icon-circle">
                    <svg class="cta-arrow" viewBox="0 0 24 24">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </button>
            <div class="text-center mt-4">
                <span class="text-[9px] font-light tracking-[0.2em] text-white/60 uppercase">© 2025 Weave AI</span>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
