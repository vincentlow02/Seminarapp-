<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap');

        body {
            font-family: 'Jost', sans-serif;
            background-color: #fafbfc;
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f3f5 100%);
        }
        
        .futura-light { 
            font-family: 'Jost', sans-serif;
            font-weight: 200;
            letter-spacing: 0.05em;
        }

        input:focus::placeholder { 
            opacity: 0; 
            transition: opacity 0.3s ease; 
        }

        /* Region button selected state */
        .region-btn.active {
            background-color: #1a1a1a;
            border-color: #1a1a1a;
        }
        .region-btn.active .region-name {
            color: #ffffff;
        }
        .region-btn.active .region-jp {
            color: rgba(255,255,255,0.45);
        }
        .region-btn.active .region-dot {
            background-color: rgba(255,255,255,0.3);
        }

        /* --- New Cloud & CTA Styles --- */
        :root {
            --blue-light: #89C4F4;
            --blue-mid: #5D9CEC;
            --blue-dark: #3A7BD5;
            --font-serif: 'Playfair Display', serif;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 12px 40px rgba(58, 123, 213, 0.15);
        }

        .bottom-action-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px; 
            z-index: 50;
            pointer-events: none; 
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 32px;
        }

        .blue-cloud-bg {
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 120%;
            height: 140%;
            background: 
                radial-gradient(circle at 30% 80%, rgba(93, 156, 236, 0.8) 0%, transparent 60%),
                radial-gradient(circle at 70% 90%, rgba(137, 196, 244, 0.7) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(58, 123, 213, 0.9) 0%, transparent 70%);
            filter: blur(40px);
            opacity: 0.85;
            z-index: -1;
            animation: cloudDrift 15s ease-in-out infinite alternate;
        }

        @keyframes cloudDrift {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.05) translate(-2%, 2%); }
            100% { transform: scale(1) translate(2%, -1%); }
        }

        .cta-wrapper {
            pointer-events: auto;
            width: calc(100% - 48px);
            max-width: 240px;
        }

        .process-cta {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: var(--glass-border);
            border-radius: 100px; 
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--glass-shadow);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .process-cta:active {
            transform: scale(0.96) translateY(2px);
            box-shadow: 0 4px 16px rgba(58, 123, 213, 0.1);
        }

        .cta-label {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 0.02em;
        }

        .cta-icon-circle {
            width: 28px;
            height: 28px;
            background: #222;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseIcon 3s infinite;
        }

        .cta-arrow {
            width: 14px;
            height: 14px;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        @keyframes pulseIcon {
            0% { box-shadow: 0 0 0 0 rgba(34, 34, 34, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 34, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 34, 34, 0); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased w-screen h-screen overflow-y-auto overflow-x-hidden flex flex-col relative">

    <header class="p-6 flex justify-between items-baseline relative z-20 w-full">
        <h1 class="text-3xl futura-light tracking-wide text-gray-900">Weave</h1>
        <span class="text-[10px] font-medium tracking-[0.2em] text-gray-500 uppercase">Tokyo, JP</span>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center relative w-full px-6 pb-6">

        <div class="w-full max-w-sm flex flex-col items-center gap-y-8">

            <!-- Name input -->
            <div class="w-full relative group">
                <label class="absolute -top-3 left-4 bg-[#fafbfc] px-3 py-0.5 flex items-baseline gap-x-1.5 z-10 border border-transparent group-focus-within:border-gray-200 rounded-full transition-colors duration-300">
                    <span class="futura-light text-sm text-gray-800">名前</span>
                    <span class="text-[8px] font-medium tracking-widest text-gray-400 uppercase">Name</span>
                </label>
                <input id="nameInput" type="text" placeholder="お名前を入力"
                    class="w-full bg-white border border-gray-200 rounded-2xl py-4 pl-5 pr-12 text-sm font-light focus:outline-none focus:border-gray-400 focus:ring-4 focus:ring-gray-50 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] transition-all placeholder:text-gray-300">
                <img src="flight-takeoff-line.png" class="absolute right-5 top-1/2 -translate-y-1/2 w-4 h-4 opacity-20 grayscale pointer-events-none" alt="">
            </div>

            <!-- Divider -->
            <div class="w-full flex items-center gap-x-3">
                <div class="flex-1 h-[1px] bg-gray-100"></div>
                <span class="flex items-baseline gap-x-1.5 whitespace-nowrap">
                    <span class="futura-light text-sm text-gray-700">地域</span>
                    <span class="text-[8px] font-medium tracking-widest text-gray-400 uppercase">Area</span>
                </span>
                <div class="flex-1 h-[1px] bg-gray-100"></div>
            </div>

            <!-- Region grid -->
            <div class="w-full grid grid-cols-2 gap-2.5">

                <button data-region="asia" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Asia</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">アジア</span>
                    </div>
                </button>

                <button data-region="se" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">SE Asia</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">東南アジア</span>
                    </div>
                </button>

                <button data-region="eu" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Europe</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">ヨーロッパ</span>
                    </div>
                </button>

                <button data-region="us" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Americas</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">アメリカ大陸</span>
                    </div>
                </button>

                <button data-region="oc" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Oceania</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">オセアニア</span>
                    </div>
                </button>

                <button data-region="other" class="region-btn col-span-1 bg-white border border-gray-200 rounded-2xl px-4 py-4 flex items-center gap-x-3 shadow-[0_2px_8px_-4px_rgba(0,0,0,0.06)] hover:border-gray-300 hover:shadow-md transition-all duration-200 group">
                    <span class="region-dot w-1.5 h-1.5 rounded-full bg-gray-200 shrink-0 transition-colors"></span>
                    <div class="flex flex-col items-start">
                        <span class="region-name text-[11px] font-medium tracking-widest text-gray-600 uppercase transition-colors">Other</span>
                        <span class="region-jp futura-light text-[10px] text-gray-400 transition-colors">ほか</span>
                    </div>
                </button>

            </div>
        </div>
    </main>

    <!-- New Cloud & Glass CTA Footer -->
    <div class="bottom-action-area">
        <div class="blue-cloud-bg"></div>
        <div class="cta-wrapper">
            <button id="recommendBtn" class="process-cta">
                <span class="cta-label">おすすめ PROCESS</span>
                <div class="cta-icon-circle">
                    <svg class="cta-arrow" viewBox="0 0 24 24">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </button>
            <div class="text-center mt-4">
                <span class="text-[9px] font-light tracking-[0.2em] text-white/60 uppercase">© 2025 Weave AI</span>
            </div>
        </div>
    </div>

    <script>
        const imageMap = {
            asia: ['asia/CN.svg', 'asia/hk.svg', 'asia/IND.svg', 'asia/jp.svg', 'asia/kr.svg', 'asia/TW.svg'],
            eu: ['eu/ch.svg', 'eu/italy.svg', 'eu/no.svg', 'eu/paris.svg', 'eu/uk.svg'],
            oc: ['oc/au.svg', 'oc/fiji.svg', 'oc/nz.svg'],
            se: ['se/bkk.svg', 'se/cam.svg', 'se/kl.svg', 'se/sg.svg', 'se/vn.svg'],
            us: ['us/ca.svg', 'us/pa.svg', 'us/us.svg'],
            other: ['other/au.svg', 'other/bkk.svg', 'other/ca.svg', 'other/cam.svg', 'other/ch.svg', 'other/CN.svg', 'other/fiji.svg', 'other/hk.svg', 'other/IND.svg', 'other/italy.svg', 'other/jp.svg', 'other/kl.svg', 'other/kr.svg', 'other/no.svg', 'other/nz.svg', 'other/other.svg', 'other/other2.svg', 'other/other3.svg', 'other/pa.svg', 'other/paris.svg', 'other/sg.svg', 'other/TW.svg', 'other/uk.svg', 'other/us.svg', 'other/vn.svg'],
        };

        let selectedRegion = null;

        document.querySelectorAll('.region-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRegion = btn.dataset.region;
            });
        });

        document.getElementById('recommendBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('名前を入力してください');
                return;
            }
            if (!selectedRegion) {
                alert('地域を選択してください');
                return;
            }

            const candidates = imageMap[selectedRegion];
            const chosenImage = candidates[Math.floor(Math.random() * candidates.length)];
            
            sessionStorage.setItem('selectedImage', chosenImage);
            sessionStorage.setItem('selectedName', name);
            localStorage.setItem('selectedImage', chosenImage);
            localStorage.setItem('selectedName', name);
            
            window.location.href = 'country.html';
        });

        // --- Magnetic Button & Parallax Interaction ---
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('recommendBtn');
            const parallaxBg = document.querySelector('.blue-cloud-bg');
            
            if (btn) {
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    btn.style.transform = `translate(${x * 0.25}px, ${y * 0.25}px) scale(1.02)`;
                });

                btn.addEventListener('mouseleave', () => {
                    btn.style.transform = `translate(0px, 0px) scale(1)`;
                });
            }

            document.addEventListener('mousemove', (e) => {
                if (window.innerWidth > 0 && parallaxBg) {
                    const x = (e.clientX / window.innerWidth - 0.5) * 2;
                    const y = (e.clientY / window.innerHeight - 0.5) * 2;
                    
                    requestAnimationFrame(() => {
                        parallaxBg.style.transform = `translate(${x * -15}px, ${y * -10}px) scale(1.05) rotateX(${y * 2}deg) rotateY(${x * -2}deg)`;
                    });
                }
            });

            let time = 0;
            function ambientBreathing() {
                time += 0.01;
                if (!document.querySelector(':hover') && parallaxBg) {
                    const scale = 1.05 + Math.sin(time) * 0.01;
                    parallaxBg.style.transform = `scale(${scale})`;
                }
                requestAnimationFrame(ambientBreathing);
            }
            ambientBreathing();
        });
    </script>
</body>
</html>
