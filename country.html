<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weave — Your Destination</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap');

    body {
      font-family: 'Jost', sans-serif;
      background-color: #fafbfc;
      background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f3f5 100%);
    }

    .futura-light {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      letter-spacing: 0.05em;
    }

    @keyframes subtle-pulse {
      0%   { box-shadow: 0 10px 25px -5px rgba(26,26,26,0.4), 0 0 0 0 rgba(26,26,26,0.1); }
      70%  { box-shadow: 0 10px 25px -5px rgba(26,26,26,0.4), 0 0 0 15px rgba(26,26,26,0); }
      100% { box-shadow: 0 10px 25px -5px rgba(26,26,26,0.4), 0 0 0 0 rgba(26,26,26,0); }
    }

    .pulse-hover:hover {
      animation: subtle-pulse 2s infinite;
    }

    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }

    /* Image card: country svg fills the card */
    #countryImageCard {
      width: 100%;
      height: 450px; /* Adjusted height per user request */
      border-radius: 2.5rem;
      overflow: hidden;
      position: relative;
      box-shadow: 0 15px 35px -10px rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.6);
      background: #f0f2f4;
    }

    #countryImage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Capture area: the whole card + info stack for screenshot */
    #captureArea {
      width: 100%;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeup {
      animation: fadeUp 0.6s ease both;
    }
    .animate-fadeup-2 { animation-delay: 0.1s; }
    .animate-fadeup-3 { animation-delay: 0.2s; }
    .animate-fadeup-4 { animation-delay: 0.3s; }
  </style>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YYSR7BXQQQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YYSR7BXQQQ');
  </script>
</head>

<body class="text-gray-800 antialiased w-screen h-screen overflow-hidden flex flex-col">

  <!-- Wrapper for full interface screenshot -->
  <div id="captureArea" class="flex flex-col h-full w-full bg-[#fafbfc]" style="background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f3f5 100%);">
    
    <!-- Header -->
    <header class="p-6 flex justify-between items-baseline relative z-20 w-full shrink-0">
      <h1 class="text-3xl futura-light tracking-wide text-gray-900">Weave</h1>
      <span class="text-[10px] font-medium tracking-[0.2em] text-gray-500 uppercase">Tokyo, JP</span>
    </header>

    <!-- Main -->
    <main class="flex-1 flex flex-col items-center relative w-full pb-12 px-6">
      <div class="w-full max-w-md flex flex-col items-center gap-y-0">
        <!-- Country Image Card -->
        <div class="animate-fadeup w-full" style="animation-delay:0s">
        <div id="countryImageCard">
          <!-- Country SVG loaded by JS: highest priority since it's above the fold -->
          <img id="countryImage" src="" alt="Country"
               fetchpriority="high"
               decoding="async"
               loading="eager">

          <!-- Share button moved to top-right of card -->
          <button id="shareButton" type="button" aria-label="シェア"
            class="absolute top-4 right-4 w-10 h-10 bg-white/90 backdrop-blur-md rounded-full flex items-center justify-center shadow-[0_8px_20px_-5px_rgba(0,0,0,0.2)] hover:scale-110 active:scale-95 transition-all duration-200 z-30">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="text-gray-700">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>

          <!-- subtle bottom gradient -->
          <div class="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-black/10 to-transparent pointer-events-none rounded-b-[2.5rem]"></div>
        </div>
      </div>

      <!-- Connector line (lengthened to push content down) -->
      <div class="w-[1px] h-12 bg-[#e2e5e9]"></div>

      <!-- Info Stack -->
      <div class="flex flex-col items-center w-full gap-y-7">

        <!-- Area pill -->
        <div class="animate-fadeup animate-fadeup-2 relative flex flex-col items-center">
          <div class="absolute -top-3.5 bg-[#fafbfc] px-4 py-0.5 rounded-full z-20 flex items-baseline space-x-2 border border-gray-100 shadow-[0_2px_6px_-2px_rgba(0,0,0,0.07)] whitespace-nowrap">
            <span class="futura-light text-xs text-gray-800">地域</span>
            <span class="text-[8px] font-medium tracking-widest text-gray-400 uppercase">Area</span>
          </div>
          <div class="bg-white/90 backdrop-blur-md border border-gray-100 rounded-full py-3 px-7 flex items-center justify-center space-x-3 shadow-[0_4px_15px_-5px_rgba(0,0,0,0.05)]">
            <span id="areaLabel" class="text-[11px] font-medium tracking-wider text-gray-600 uppercase">—</span>
          </div>
        </div>

        <div class="animate-fadeup animate-fadeup-3 flex items-center justify-center gap-x-5">
          <!-- Left: Country name + Japanese -->
          <div class="flex flex-col items-start">
            <span id="destLabel" class="text-base font-medium tracking-[0.15em] text-gray-800 uppercase leading-tight"></span>
            <span id="destJp" class="futura-light text-[10px] text-gray-400 tracking-widest mt-0.5"></span>
          </div>
          <!-- Vertical Divider -->
          <div class="w-[1px] h-8 bg-gray-200"></div>
          <!-- Thumbnail: lazy + async decode — not above fold, save bandwidth -->
          <div class="overflow-hidden rounded-full w-10 h-10 border border-gray-100 shadow-sm flex-shrink-0" style="background:#f3f4f6">
            <img id="destCode" src="" alt="" loading="lazy" decoding="async" class="w-full h-full object-cover object-center" />
          </div>
        </div>

        <!-- Dashed Divider -->
        <div class="w-48 border-t border-dashed border-gray-400 -my-2 animate-fadeup animate-fadeup-3"></div>

        <!-- Minimal Record Display (no box, no label) -->
        <div class="animate-fadeup animate-fadeup-4 flex flex-col items-center pt-2">
          <span id="userName" class="text-[12px] font-medium tracking-wide text-gray-700 leading-none mb-1.5 uppercase tracking-widest"></span>
          <span id="timestamp" class="futura-light text-[9px] tracking-[0.1em] text-gray-400"></span>
        </div>

      </div>
      </div><!-- end info-stack -->
    </main>

    <!-- Footer inside captureArea -->
    <footer class="w-full px-8 pb-8 pt-2 flex items-center justify-end relative z-30 shrink-0 mt-auto opacity-40">
      <div class="flex items-center gap-x-2.5">
        <span class="text-[9px] font-light tracking-[0.2em] text-gray-400 uppercase leading-none">© 2025 Weave AI</span>
        <img src="flight-takeoff-line.png" alt="Takeoff" class="w-4 h-4 grayscale leading-none">
      </div>
    </footer>

  </div><!-- end captureArea wrapper -->

  <script>
    (function () {

      // ── Data from storage ──────────────────────────────────────────
      const storedImage = sessionStorage.getItem('selectedImage') || localStorage.getItem('selectedImage') || 'asia/jp.svg';
      const storedName  = sessionStorage.getItem('selectedName')  || localStorage.getItem('selectedName')  || '';

      // ── Country / destination metadata map ─────────────────────────
      const destinationMeta = {
        // Asia
        'asia/CN.svg':  { label: 'China',        code: 'CN', jp: '中国',        flag: '🇨🇳', area: 'Asia' },
        'asia/hk.svg':  { label: 'Hong Kong',    code: 'HK', jp: '香港',        flag: '🇭🇰', area: 'Asia' },
        'asia/IND.svg': { label: 'India',         code: 'IN', jp: 'インド',      flag: '🇮🇳', area: 'Asia' },
        'asia/jp.svg':  { label: 'Japan',         code: 'JP', jp: '日本',        flag: '🇯🇵', area: 'Asia' },
        'asia/kr.svg':  { label: 'Korea',         code: 'KR', jp: '韓国',        flag: '🇰🇷', area: 'Asia' },
        'asia/TW.svg':  { label: 'Taiwan',        code: 'TW', jp: '台湾',        flag: '🇹🇼', area: 'Asia' },
        // Europe
        'eu/ch.svg':    { label: 'Switzerland',   code: 'CH', jp: 'スイス',      flag: '🇨🇭', area: 'Europe' },
        'eu/italy.svg': { label: 'Italy',         code: 'IT', jp: 'イタリア',    flag: '🇮🇹', area: 'Europe' },
        'eu/no.svg':    { label: 'Norway',        code: 'NO', jp: 'ノルウェー',  flag: '🇳🇴', area: 'Europe' },
        'eu/paris.svg': { label: 'France',        code: 'FR', jp: 'フランス',    flag: '🇫🇷', area: 'Europe' },
        'eu/uk.svg':    { label: 'UK',            code: 'GB', jp: 'イギリス',    flag: '🇬🇧', area: 'Europe' },
        // Oceania
        'oc/au.svg':    { label: 'Australia',     code: 'AU', jp: 'オーストラリア', flag: '🇦🇺', area: 'Oceania' },
        'oc/fiji.svg':  { label: 'Fiji',          code: 'FJ', jp: 'フィジー',     flag: '🇫🇯', area: 'Oceania' },
        'oc/nz.svg':    { label: 'New Zealand',   code: 'NZ', jp: 'ニュージーランド', flag: '🇳🇿', area: 'Oceania' },
        // SE Asia
        'se/bkk.svg':   { label: 'Thailand',      code: 'TH', jp: 'タイ',        flag: '🇹🇭', area: 'SE Asia' },
        'se/cam.svg':   { label: 'Cambodia',      code: 'KH', jp: 'カンボジア',  flag: '🇰🇭', area: 'SE Asia' },
        'se/kl.svg':    { label: 'Malaysia',      code: 'MY', jp: 'マレーシア',  flag: '🇲🇾', area: 'SE Asia' },
        'se/sg.svg':    { label: 'Singapore',     code: 'SG', jp: 'シンガポール', flag: '🇸🇬', area: 'SE Asia' },
        'se/vn.svg':    { label: 'Vietnam',       code: 'VN', jp: 'ベトナム',    flag: '🇻🇳', area: 'SE Asia' },
        // Americas
        'us/ca.svg':    { label: 'Canada',        code: 'CA', jp: 'カナダ',      flag: '🇨🇦', area: 'The Americas' },
        'us/pa.svg':    { label: 'Panama',        code: 'PA', jp: 'パナマ',      flag: '🇵🇦', area: 'The Americas' },
        'us/us.svg':    { label: 'USA',           code: 'US', jp: 'アメリカ',    flag: '🇺🇸', area: 'The Americas' },
      };

      // ── Apply country image ─────────────────────────────────────────
      const imgEl = document.getElementById('countryImage');
      imgEl.src = storedImage;

      // ── Apply metadata ──────────────────────────────────────────────
      const meta = destinationMeta[storedImage];
      if (meta) {
        document.getElementById('destLabel').textContent = meta.label;
        document.getElementById('destCode').src          = storedImage;
        document.getElementById('destCode').alt          = meta.label;
        document.getElementById('destJp').textContent    = meta.jp;
        document.getElementById('areaLabel').textContent = meta.area;
      } else {
        document.getElementById('destLabel').textContent = 'Unknown';
        document.getElementById('destCode').src          = storedImage;
        document.getElementById('destCode').alt          = 'Unknown';
        document.getElementById('destJp').textContent    = 'ほか';
        document.getElementById('areaLabel').textContent = 'Other';
      }

      // ── User name ──────────────────────────────────────────────────
      const nameEl = document.getElementById('userName');
      nameEl.textContent = storedName || '';

      // ── Live timestamp ─────────────────────────────────────────────
      const tsEl = document.getElementById('timestamp');
      function updateTimestamp() {
        if (!tsEl) return;
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        tsEl.textContent =
          `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ` +
          `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      }
      updateTimestamp();
      setInterval(updateTimestamp, 1000);

      // ── Share / screenshot ─────────────────────────────────────────
      const shareButton  = document.getElementById('shareButton');
      const captureArea  = document.getElementById('captureArea');

      // Preload html2canvas in the background while user reads the result
      // so there is zero delay when they tap Share
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          if (typeof window.html2canvas !== 'function') {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
            document.head.appendChild(s);
          }
        }, { timeout: 3000 });
      }

      async function shareCapture() {
        if (!captureArea) return;

        // Smart cache: key by image + name + current minute so timestamp stays fresh
        const nowMinute = new Date().toISOString().slice(0, 16); // e.g. "2026-03-22T15:23"
        const cacheKey = `snap:${storedImage}:${storedName}:${nowMinute}`;
        let dataUrl = sessionStorage.getItem(cacheKey);

        if (!dataUrl) {
          // Ensure html2canvas is loaded (may already be loaded from idle preload)
          if (typeof window.html2canvas !== 'function') {
            await new Promise((resolve, reject) => {
              const s = document.createElement('script');
              s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
              s.onload = resolve;
              s.onerror = () => reject(new Error('failed to load html2canvas'));
              document.head.appendChild(s);
            });
          }

          // Hide share button during capture for a clean image
          const originalShareDisplay = shareButton.style.display;
          shareButton.style.display = 'none';

          // Exact screen dimensions
          const width  = captureArea.offsetWidth;
          const height = captureArea.offsetHeight;

          try {
            const canvas = await window.html2canvas(captureArea, {
              useCORS:     true,
              backgroundColor: '#fafbfc',
              scale:       3,
              logging:     false,
              width, height,
              windowWidth: width,
              windowHeight: height,
              x: 0, y: 0
            });
            dataUrl = canvas.toDataURL('image/png', 1.0);
            // Cache for this minute — share taps within 60s are instant
            sessionStorage.setItem(cacheKey, dataUrl);
          } catch (err) {
            console.error('capture failed', err);
            shareButton.style.display = originalShareDisplay;
            return;
          }

          shareButton.style.display = originalShareDisplay;
        }

        try {
          const res  = await fetch(dataUrl);
          const blob = await res.blob();
          const file = new File([blob], 'weave-recommendation.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
          } else {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'weave-recommendation.png';
            a.click();
          }
        } catch (err) {
          console.error('share failed', err);
        }
      }

      shareButton.addEventListener('click', shareCapture);

    })();
  </script>

</body>
</html>
